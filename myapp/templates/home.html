<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  {% block title %}
  <title>Cinelist - Intro</title>
  {% endblock %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  {% load static %}

  {% block style %}
  <style>
    body {
     background-image: url("{% static 'images/avt_bg.jpg' %}");
     background-size: cover;
     background-position: right;
     background-repeat: no-repeat;
     height: 100vh;
     margin: 0;
    }

    .overlay {
      height: 100%;
      width: 100%;
    }

    .content-box {
      text-align: center;
      color: rgb(230, 227, 255);
    }

    .btn-custom {
      padding: 7px 25px;
      font-size: 1.1rem;
      border-radius: 30px;
    }

    .btn-register {
      background-color: #198754;
      color: white;
    }

    .btn-login {
      background-color: #198754;
      color: white;
    }

    .btn-register:hover {
      background-color: #0d6efd;
    }

    .btn-login:hover {
      background-color: #0d6efd;
    }

    .quote {
      font-size: 2rem;
      font-weight: 600;
    }

    .author {
      font-style: italic;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

{% endblock %}

{% block cards %}
    
<div class="overlay d-flex align-items-center">
  <div class="content-box ms-4 mt-5">
    <h1 class="quote mb-3">
    <img style="width: 200px; height: 200px; padding-bottom: 20px;" class="mx-auto" src="{% static 'images/logos.png' %}" alt="">
      “Once you overcome the <br>one-inch tall barrier of subtitles,<br> you will be introduced to so many more amazing films.”
    </h1>
    <p class="author">– Bong Joon-ho</p>
    <div class="d-flex gap-5 justify-content-center">
      <a href="{% url 'signup' %}" class="btn btn-custom btn-register">Register</a>
      <a href="{% url 'login' %}" class="btn btn-custom btn-login">Login</a>
    </div>
  </div>
</div>
</body>
</html>

{% endblock %}
