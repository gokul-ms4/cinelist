{% extends 'base.html' %}

{% block title %}
<title>Cinelist - Verify Password</title>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="mx-auto" style="max-width: 600px;">

    <!-- Header -->
    <div class="mb-4">
      <p style="font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px;">
        <i class="fas fa-lock me-1"></i> Security
      </p>
      <h2 style="font-family:'Playfair Display',serif; font-weight:600; font-size:1.9rem; color:var(--text); margin:0 0 4px;">
        Verify Password
      </h2>
      <p style="font-size:0.88rem; color:var(--text-muted); margin:0;">
        Enter your current password to continue.
      </p>
    </div>

    <!-- Card -->
    <div style="
      background: linear-gradient(160deg, var(--surface-raised) 0%, var(--surface) 100%);
      border: 1px solid rgba(201,162,75,0.18);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,162,75,0.06);
      overflow: hidden;
      position: relative;
    ">
      <!-- Gold top accent -->
      <div style="height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0.5;"></div>

      <div class="p-4 p-md-5">
        <form action="" method="post" class="w-100">
          {% csrf_token %}

          <style>
            #verify-form p { margin-bottom: 18px; }

            #verify-form label {
              display: block;
              font-size: 0.75rem;
              letter-spacing: 0.08em;
              text-transform: uppercase;
              color: var(--text-muted);
              font-weight: 600;
              margin-bottom: 7px;
            }

            #verify-form input {
              width: 100%;
              background-color: var(--ink);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: 9px;
              padding: 11px 14px;
              font-size: 0.92rem;
              font-family: 'Inter', sans-serif;
              transition: border-color 160ms ease, box-shadow 160ms ease;
            }

            #verify-form input:focus {
              outline: none;
              border-color: var(--gold);
              box-shadow: 0 0 0 3px rgba(201,162,75,0.15);
            }

            #verify-form ul.errorlist {
              list-style: none;
              padding: 0;
              margin: 6px 0 0;
              color: #e07a7a;
              font-size: 0.8rem;
            }
          </style>

          <!-- Current Password label -->
          <p style="font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); font-weight:600; margin-bottom:7px;">
            Current Password
          </p>

          <div id="verify-form">
            {{ form }}
          </div>

          <!-- Forgot password link -->
          <div class="mt-1 mb-4">
            <a href="{% url 'forgotpswd' %}" style="font-size:0.82rem; color:var(--text-muted); text-decoration:none; transition: color 160ms ease;"
               onmouseover="this.style.color='var(--gold-bright)';"
               onmouseout="this.style.color='var(--text-muted)';">
              <i class="fas fa-key me-1"></i>Forgot Password?
            </a>
          </div>

          <!-- Divider -->
          <div style="height:1px; background:var(--border); margin-bottom:24px;"></div>

          <!-- Actions -->
          <div class="d-flex gap-3">
            <button type="submit" style="
              flex: 1;
              background-color: var(--gold);
              border: none;
              color: #16130c;
              font-weight: 600;
              font-size: 0.92rem;
              letter-spacing: 0.02em;
              padding: 11px 0;
              border-radius: 999px;
              transition: transform 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
              box-shadow: 0 6px 24px rgba(201,162,75,0.22);
              cursor: pointer;
            "
            onmouseover="this.style.backgroundColor='var(--gold-bright)'; this.style.transform='translateY(-2px)';"
            onmouseout="this.style.backgroundColor='var(--gold)'; this.style.transform='translateY(0)';">
              <i class="fas fa-shield-halved me-2"></i>Verify
            </button>

            <a href="{% url 'user_profile' %}" style="flex:1; text-decoration:none;">
              <button type="button" style="
                width: 100%;
                background-color: transparent;
                border: 1px solid var(--border);
                color: var(--text-muted);
                font-weight: 600;
                font-size: 0.92rem;
                letter-spacing: 0.02em;
                padding: 11px 0;
                border-radius: 999px;
                transition: border-color 180ms ease, color 180ms ease;
                cursor: pointer;
              "
              onmouseover="this.style.borderColor='var(--gold)'; this.style.color='var(--gold-bright)';"
              onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text-muted)';">
                <i class="fas fa-arrow-left me-2"></i>Back
              </button>
            </a>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
