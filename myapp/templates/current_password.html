{% extends 'base.html' %}

{% block title %}
<title>Cinelist - Verify Password</title>
{% endblock %}

{% block content %}
<style>
  *, *::before, *::after { box-sizing: border-box; }

  /* ── Page wrapper ─────────────────────────────────────────── */
  .verify-page {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  /* ── Header ───────────────────────────────────────────────── */
  .verify-eyebrow {
    font-size: clamp(0.65rem, 2.5vw, 0.72rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .verify-title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    color: var(--text);
    margin: 0 0 4px;
  }

  .verify-subtitle {
    font-size: clamp(0.82rem, 3vw, 0.88rem);
    color: var(--text-muted);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  /* ── Card ─────────────────────────────────────────────────── */
  .verify-card {
    background: linear-gradient(160deg, var(--surface-raised) 0%, var(--surface) 100%);
    border: 1px solid rgba(201,162,75,0.18);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,162,75,0.06);
    overflow: hidden;
    position: relative;
  }

  .verify-card-accent {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }

  .verify-card-body {
    padding: clamp(20px, 5vw, 40px);
  }

  /* ── Form fields ──────────────────────────────────────────── */
  .verify-field-label {
    display: block;
    font-size: clamp(0.68rem, 2.5vw, 0.75rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 7px;
  }

  #verify-form p { margin-bottom: 18px; }

  #verify-form label {
    display: block;
    font-size: clamp(0.68rem, 2.5vw, 0.75rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 7px;
  }

  #verify-form input {
    width: 100%;
    background-color: var(--ink);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 12px 14px;
    font-size: clamp(0.88rem, 3.5vw, 0.92rem);
    font-family: 'Inter', sans-serif;
    transition: border-color 160ms ease, box-shadow 160ms ease;
    -webkit-appearance: none;
    appearance: none;
  }

  /* Prevent iOS zoom on focus */
  @media (max-width: 480px) {
    #verify-form input { font-size: 16px; }
  }

  #verify-form input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,162,75,0.15);
  }

  #verify-form ul.errorlist {
    list-style: none;
    padding: 0;
    margin: 6px 0 0;
    color: #e07a7a;
    font-size: clamp(0.75rem, 2.8vw, 0.8rem);
  }

  /* ── Forgot password link ─────────────────────────────────── */
  .verify-forgot {
    display: inline-block;
    margin: 8px 0 24px;
    font-size: clamp(0.78rem, 3vw, 0.82rem);
    color: var(--text-muted);
    text-decoration: none;
    transition: color 160ms ease;
    padding: 4px 0; /* larger tap area vertically */
    -webkit-tap-highlight-color: transparent;
  }

  .verify-forgot:hover,
  .verify-forgot:active { color: var(--gold-bright); }

  /* ── Divider ──────────────────────────────────────────────── */
  .verify-divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 24px;
  }

  /* ── Action buttons ───────────────────────────────────────── */
  .verify-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .verify-btn-submit,
  .verify-btn-back {
    flex: 1;
    min-width: 120px;
    font-weight: 600;
    font-size: clamp(0.85rem, 3.5vw, 0.92rem);
    letter-spacing: 0.02em;
    padding: 13px 0;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    transition: transform 180ms ease, background-color 180ms ease,
                box-shadow 180ms ease, border-color 180ms ease, color 180ms ease;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .verify-btn-submit {
    background-color: var(--gold);
    color: #16130c;
    box-shadow: 0 6px 24px rgba(201,162,75,0.22);
  }

  @media (hover: hover) {
    .verify-btn-submit:hover {
      background-color: var(--gold-bright);
      transform: translateY(-2px);
    }
  }

  .verify-btn-submit:active {
    background-color: var(--gold-bright);
    transform: translateY(0);
  }

  .verify-btn-back {
    background-color: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  @media (hover: hover) {
    .verify-btn-back:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }
  }

  .verify-btn-back:active {
    border-color: var(--gold);
    color: var(--gold-bright);
  }

  /* ── Extra-small phones ───────────────────────────────────── */
  @media (max-width: 360px) {
    .verify-page { padding: 20px 10px 80px; }
    .verify-card-body { padding: 16px; }
    .verify-actions { flex-direction: column; }
    .verify-btn-submit,
    .verify-btn-back { width: 100%; }
  }
</style>

<div class="verify-page">

  <!-- Header -->
  <div>
    <p class="verify-eyebrow"><i class="fas fa-lock me-1"></i> Security</p>
    <h2 class="verify-title">Verify Password</h2>
    <p class="verify-subtitle">Enter your current password to continue.</p>
  </div>

  <!-- Card -->
  <div class="verify-card">
    <div class="verify-card-accent"></div>

    <div class="verify-card-body">
      <form action="" method="post">
        {% csrf_token %}

        <!-- Current Password label -->
        <span class="verify-field-label">Current Password</span>

        <div id="verify-form">
          {{ form }}
        </div>

        <!-- Forgot password link -->
        <a href="{% url 'forgotpswd' %}" class="verify-forgot">
          <i class="fas fa-key me-1"></i>Forgot Password?
        </a>

        <div class="verify-divider"></div>

        <!-- Actions -->
        <div class="verify-actions">
          <button type="submit" class="verify-btn-submit">
            <i class="fas fa-shield-halved"></i> Verify
          </button>
          <a href="{% url 'user_profile' %}" class="verify-btn-back">
            <i class="fas fa-arrow-left"></i> Back
          </a>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
