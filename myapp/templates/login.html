{% extends 'home.html' %}

{% block title %}
  <title>Cinelist - Login</title>
{% endblock %}

  {% load static %}

  {% block style %}
  <style>
  body {
    background-image: url("{% static 'images/bg_blur.png' %}");
    background-size: cover;
    background-position: right;
    background-repeat: no-repeat;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start; 
    padding-left: 60px; 
  }

  .login-card {
    width: 650px;
    height: 450px;
    display: flex;
    background-color: #1e293b;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
  }

  .poster {
    width: 45%;
    background: url("{% static 'images/min_in.jpeg' %}") no-repeat center center;
    background-size: cover;
  }

  .form-section {
    width: 55%;
    padding: 30px;
    color: #fff;
  }

  .form-control {
    background-color: #0f172a;
    border: 1px solid #334155;
    color: white;
  }

  .form-control:focus {
    border-color: #ef4444;
    box-shadow: none;
  }

  .btn-danger {
    background-color: #ef4444;
    border: none;
  }

  .btn-danger:hover {
    background-color: #dc2626;
  }

  .form-link {
    color: #94a3b8;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .form-link:hover {
    color: #f87171;
  }

  .highlight {
    color: #ef4444;
  }
</style>
</head>
<body>

{% endblock %}

{% block cards %}
<div class="login-card">
  <div class="poster d-none d-md-block"></div>
  <div class="form-section">
    <h2 class="fw-bold mb-2">Welcome back,</h2>
    <p class="mb-4 text-secondary">Sign in to your account</p>

    <form method="POST" action="">
      {% csrf_token %}
      {{form.as_p}}

      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{% url 'forgotpswd' %}" class="form-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-danger w-100">Sign In</button>
    </form>

    <p class="text-center mt-4 text-secondary">
      Don’t have an account?
      <a href="{% url 'signup' %}" class="highlight">Sign up</a>
    </p>
  </div>
</div>

</body>
</html>

{% endblock %}
