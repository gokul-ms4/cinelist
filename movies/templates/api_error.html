{% extends "base.html" %}

{% block content %}
<style>
  .loading-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    background:
      radial-gradient(ellipse 600px 400px at 50% 30%, rgba(201,162,75,0.06), transparent 65%),
      var(--ink);
  }

  /* ── Animated reel ── */
  .loading-reel {
    width: 72px;
    height: 72px;
    margin-bottom: 28px;
    animation: spin 2.4s linear infinite;
    opacity: 0.75;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-reel { animation: none; opacity: 0.5; }
  }

  /* ── Dot pulse bar ── */
  .loading-dots {
    display: flex;
    gap: 7px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .loading-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
    40%           { opacity: 1;   transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-dots span { animation: none; opacity: 0.5; }
  }

  /* ── Text ── */
  .loading-eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .loading-title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.65rem;
    color: var(--text);
    margin: 0 0 10px;
    line-height: 1.2;
  }

  .loading-sub {
    font-size: 0.9rem;
    color: var(--text-muted);
    max-width: 340px;
    line-height: 1.6;
    margin: 0 auto;
    min-height: 2.8em; /* prevent layout shift when text swaps */
    transition: opacity 300ms ease;
  }

  /* ── Retry progress bar ── */
  .loading-progress {
    margin-top: 28px;
    width: 200px;
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .loading-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 999px;
    width: 0%;
    transition: width 1.4s linear;
  }

  .loading-progress-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 8px;
    letter-spacing: 0.04em;
  }

  /* ── Error state card ── */
  .error-card {
    display: none;
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
    max-width: 360px;
    text-align: center;
  }

  .error-card .error-icon {
    font-size: 1.5rem;
    color: #e07a7a;
    margin-bottom: 12px;
  }

  .error-card p {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 0 0 18px;
    line-height: 1.6;
  }

  .error-retry-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    color: #16130c;
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 160ms ease, transform 160ms ease;
  }

  .error-retry-btn:hover {
    background: var(--gold-bright);
    color: #16130c;
    transform: translateY(-1px);
  }

  /* Mobile */
  @media (max-width: 576px) {
    .loading-title { font-size: 1.35rem; }
    .loading-reel  { width: 56px; height: 56px; margin-bottom: 22px; }
    .error-card    { padding: 20px 20px; }
  }
</style>

<div class="loading-wrap">

  <!-- Spinning film reel SVG -->
  <svg class="loading-reel" viewBox="0 0 400 400" fill="none" aria-hidden="true">
    <circle cx="200" cy="200" r="190" stroke="#c9a24b" stroke-width="6"  opacity="0.2"/>
    <circle cx="200" cy="200" r="150" stroke="#c9a24b" stroke-width="4"  opacity="0.18"/>
    <circle cx="200" cy="200" r="46"  stroke="#c9a24b" stroke-width="8"  opacity="0.3"/>
    <circle cx="200" cy="90"  r="26"  stroke="#c9a24b" stroke-width="6"  opacity="0.25"/>
    <circle cx="310" cy="200" r="26"  stroke="#c9a24b" stroke-width="6"  opacity="0.25"/>
    <circle cx="200" cy="310" r="26"  stroke="#c9a24b" stroke-width="6"  opacity="0.25"/>
    <circle cx="90"  cy="200" r="26"  stroke="#c9a24b" stroke-width="6"  opacity="0.25"/>
  </svg>

  <p class="loading-eyebrow">Cinelist</p>
  <h4 class="loading-title">Fetching movie data…</h4>

  <div class="loading-dots">
    <span></span><span></span><span></span>
  </div>

  <p class="loading-sub" id="retry-msg">Retrying automatically, please wait.</p>

  <!-- Retry progress bar (visible during retries) -->
  <div class="loading-progress" id="progress-wrap">
    <div class="loading-progress-fill" id="progress-fill"></div>
  </div>
  <p class="loading-progress-label" id="progress-label">Attempt <span id="attempt-num">1</span> of 6</p>

  <!-- Error card (shown after all retries fail) -->
  <div class="error-card" id="error-card">
    <div class="error-icon"><i class="fas fa-film"></i></div>
    <p>The movie service seems to be unavailable right now. It usually comes back quickly.</p>
    <a href="javascript:location.reload()" class="error-retry-btn">
      <i class="fas fa-rotate-right"></i> Try Again
    </a>
  </div>

</div>

<script>
  (function () {
    const key       = "cinelist_retry_count";
    const maxRetries = 6;
    const delayMs   = 1500;

    let count = parseInt(sessionStorage.getItem(key) || "0", 10);

    const msg          = document.getElementById("retry-msg");
    const progressFill = document.getElementById("progress-fill");
    const attemptNum   = document.getElementById("attempt-num");
    const progressWrap = document.getElementById("progress-wrap");
    const progressLbl  = document.getElementById("progress-label");
    const errorCard    = document.getElementById("error-card");

    if (count < maxRetries) {
      sessionStorage.setItem(key, count + 1);

      // Update attempt counter
      attemptNum.textContent = count + 1;

      // Animate progress bar to reflect this attempt's progress
      const pct = ((count + 1) / maxRetries) * 100;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          progressFill.style.width = pct + "%";
        });
      });

      setTimeout(() => window.location.reload(), delayMs);
    } else {
      // All retries exhausted — show error state
      sessionStorage.removeItem(key);

      msg.style.opacity = "0";
      setTimeout(() => {
        msg.style.display = "none";
      }, 300);

      progressWrap.style.display = "none";
      progressLbl.style.display  = "none";

      errorCard.style.display = "block";
    }
  })();
</script>

{% endblock %}
