{% extends "base.html" %}
{% block content %}
<div class="text-center mt-5">
  <div class="spinner-border text-primary mb-3" role="status"></div>
  <h4>Fetching movie data…</h4>
  <p id="retry-msg" class="text-muted">Retrying automatically, please wait.</p>
</div>

<script>
  (function () {
    const key = "cinelist_retry_count";
    const maxRetries = 6;
    const delayMs = 1500;

    let count = parseInt(sessionStorage.getItem(key) || "0", 10);

    if (count < maxRetries) {
      sessionStorage.setItem(key, count + 1);
      setTimeout(() => window.location.reload(), delayMs);
    } else {
      sessionStorage.removeItem(key);
      document.getElementById("retry-msg").innerText =
        "The movie service seems to be down. Please try again in a moment.";
    }
  })();
</script>
{% endblock %}
