{% extends "base.html" %}

{% block title %}
  <title>Edit Review - {{ title }}</title>
{% endblock %}

{% block content %}
<style>
  .review-form-label {
    font-weight: 500;
    margin-bottom: 5px;
    color: #ddd;
  }

  .form-control {
    background-color: #2c2c2c;
    border: 1px solid #444;
    color: white;
    padding: 10px;
    border-radius: 6px;
    width: 100%;
  }

  .form-control:focus {
    background-color: #1f1f1f;
    border-color: #007bff;
    color: white;
    box-shadow: none;
    outline: none;
  }

  .card {
    border-radius: 12px;
    border: none;
  }

  .btn-primary {
    background-color: #007bff;
    border-color: #007bff;
  }

  .btn-primary:hover {
    background-color: #0056b3;
  }
</style>

<div class="container mt-5 text-white">
  <h2 class="mb-4">Write a review about <strong>{{ title }}</strong></h2>

  <div class="card bg-dark p-4 shadow">
    <form method="POST">
      {% csrf_token %}
      <div class="row">

        <div class="col-md-3 mb-3">
          <label for="rating" class="review-form-label">Rating (1-5)</label>
          {{form.rating}}
        </div>
        <div class="col-md-9"></div>
      </div>

      <div class="mb-3">
        <label for="content" class="review-form-label">Your Review</label>
        {{form.content}}
      </div>

      <button type="submit" class="btn btn-primary mt-3">
        <i class="fas fa-paper-plane"></i> Update Review
      </button>
    </form>
  </div>
</div>

{% endblock %}
